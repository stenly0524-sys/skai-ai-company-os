name: SKAI V0.5 browser and mobile checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/v05-browser-check.yml'
  push:
    branches: [feature/v0.5-core-foundation]
    paths:
      - 'frontend/**'
      - '.github/workflows/v05-browser-check.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: skai-browser-test-report
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
